name: Publish package

on:
  release:
    types: [published]
  # Manual dry run: every gate and the tarball, but no npm publish and no
  # release upload (both steps only run on a `release` event).
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, pack, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # No `registry-url` here on purpose: setup-node v6 exported a dummy
          # NODE_AUTH_TOKEN and wrote `_authToken=${NODE_AUTH_TOKEN}` into
          # .npmrc, so npm authenticated with that dummy token instead of
          # exchanging the OIDC token — the registry answered 404 ("could not
          # be found or you do not have permission") on the very first real
          # publish. v7 removed the fallback; leaving the registry at its
          # default keeps .npmrc free of any auth token.
          package-manager-cache: false

      - name: Update npm for trusted publishing
        shell: bash
        run: |
          # Trusted publishing needs npm >= 11.5.1. Pin the major line instead
          # of `@latest` so a new npm release cannot change this job's behavior
          # without a commit here.
          npm install --global 'npm@^11.5.1'
          npm --version

      - name: Check trusted-publishing prerequisites
        shell: bash
        run: |
          # Trusted publishing only works when npm has no token to prefer: any
          # _authToken in the config is sent instead of the OIDC exchange.
          # setup-node v6 used to export a dummy NODE_AUTH_TOKEN; fail loudly if
          # one ever comes back.
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::NODE_AUTH_TOKEN is set; npm would use it instead of the OIDC exchange"
            exit 1
          fi
          for file in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc" "$GITHUB_WORKSPACE/.npmrc"; do
            [[ -n "$file" && -f "$file" ]] || continue
            if grep -q '_authToken' "$file"; then
              echo "::error::$file pins an _authToken; trusted publishing needs no token"
              exit 1
            fi
          done

          # npm only attempts the OIDC exchange when the runner handed it these
          # variables, which requires `permissions: id-token: write`. Without
          # them `npm publish` reports ENEEDAUTH ("You need to authorize this
          # machine using npm adduser"), which says nothing about the real cause.
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::OIDC request variables are missing; the job did not get id-token: write"
            exit 1
          fi

          # Then exercise the exact exchange npm performs, and print what npm
          # only reveals at --loglevel=verbose. A 404 here means the npm
          # Trusted Publisher entry (repository, workflow filename, environment)
          # does not match this run.
          audience="npm:registry.npmjs.org"
          oidc="$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience")"
          id_token="$(node --input-type=commonjs -e 'process.stdout.write(JSON.parse(process.argv[1]).value)' "$oidc")"
          package_name="$(node --input-type=commonjs --eval "process.stdout.write(require('./package.json').name)")"
          escaped_name="$(node --input-type=commonjs -e 'process.stdout.write(process.argv[1].replace("/", "%2f"))' "$package_name")"
          status="$(curl -sS -o "$RUNNER_TEMP/exchange.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$escaped_name")"
          echo "OIDC token exchange status: $status"
          # npm answers 201 Created because the exchange mints a token, so any
          # 2xx means the Trusted Publisher entry matched this run.
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            cat "$RUNNER_TEMP/exchange.json" || true
            echo "::error::npm rejected the OIDC token exchange; check the package's Trusted Publisher entry"
            exit 1
          fi
          echo "OIDC exchange accepted (the minted token is intentionally not printed)"

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          package_version="$(node --input-type=commonjs --eval "process.stdout.write(require('./package.json').version)")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Pack release tarball
        id: pack
        shell: bash
        run: |
          mkdir -p dist
          tarball="$(npm pack --pack-destination dist)"
          test -f "dist/$tarball"
          echo "path=dist/$tarball" >> "$GITHUB_OUTPUT"

      - name: Inspect tarball contents
        shell: bash
        run: |
          # `lib/` is not committed, so a broken build would otherwise publish a
          # package without its runtime entry point.
          tarball="${{ steps.pack.outputs.path }}"
          # Capture the listing once: piping `tar` straight into `grep -q`
          # makes tar die of SIGPIPE as soon as grep quits on its first match,
          # and `bash -eo pipefail` would then report the pipeline as failed.
          tar -tzf "$tarball" > "$RUNNER_TEMP/tarball-files.txt"
          missing=0
          for required in \
            package/package.json \
            package/lib/index.js \
            package/lib/types/index.d.ts \
            package/client/client.js \
            package/cordis.patch.yml; do
            if ! grep -qx "$required" "$RUNNER_TEMP/tarball-files.txt"; then
              echo "::error::tarball is missing $required"
              missing=1
            fi
          done
          exit "$missing"

      - name: Attach tarball to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.pack.outputs.path }}" --clobber

      - name: Check whether this npm version already exists
        id: npm-version
        shell: bash
        run: |
          package_name="$(node --input-type=commonjs --eval "process.stdout.write(require('./package.json').name)")"
          package_version="$(node --input-type=commonjs --eval "process.stdout.write(require('./package.json').version)")"
          if npm view "$package_name@$package_version" version --json >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        # Trusted publishing (OIDC) authenticates these calls; no token exists.
        if: github.event_name == 'release' && steps.npm-version.outputs.exists != 'true'
        run: npm publish "$GITHUB_WORKSPACE/${{ steps.pack.outputs.path }}" --provenance

      - name: Verify the published version and its provenance
        if: github.event_name == 'release' && steps.npm-version.outputs.exists != 'true'
        shell: bash
        run: |
          package_name="$(node --input-type=commonjs --eval "process.stdout.write(require('./package.json').name)")"
          package_version="$(node --input-type=commonjs --eval "process.stdout.write(require('./package.json').version)")"
          npm view "$package_name@$package_version" version
          attestations="$(npm view "$package_name@$package_version" dist.attestations --json 2>/dev/null || true)"
          if [[ "$attestations" == *'"url"'* ]]; then
            echo "provenance attestation present: $attestations"
          else
            echo "::warning::published $package_name@$package_version without a provenance attestation"
          fi
