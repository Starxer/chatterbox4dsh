name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [locked, latest-harness]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Re-resolve Harness packages from the registry
        if: matrix.dependencies == 'latest-harness'
        shell: bash
        run: |
          # Drop the lockfile and resolve the declared @deepseek-ai/dsh-*
          # ranges (^0.1.3-alpha.1) afresh, so a newer compatible Harness
          # release is exercised without editing the lockfile. Plain
          # `npm install` (no --legacy-peer-deps) is required here: the
          # optional peer packages the source imports at type level
          # (dsh-api-session-controller, dsh-host-directory-picker,
          # dsh-user-approval) are only auto-installed when peer resolution
          # is enabled.
          rm -f package-lock.json
          npm install

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Inspect package contents
        run: npm pack --dry-run
